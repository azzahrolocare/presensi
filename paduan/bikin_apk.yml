name: Build Android APK (Presensi)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-cache: 'npm'
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create cordova-app id.web.azzahro.presensi "Presensi Az-Zahro"
        cd cordova-app
        cordova platform add android
        
        # Tambahkan plugin inti UI, Kamera, Navigasi, dan Orientasi Layar
        cordova plugin add cordova-plugin-statusbar
        cordova plugin add cordova-plugin-inappbrowser
        cordova plugin add cordova-plugin-camera
        cordova plugin add cordova-plugin-android-permissions
        cordova plugin add cordova-plugin-screen-orientation

    - name: Copy Web Assets to Cordova
      run: |
        # Bersihkan folder www bawaan cordova
        rm -rf cordova-app/www/*
        
        # Salin file web utama termasuk default.html secara aman
        cp -r default.html index.html offline.html rekapitulasi.html sw.js manifest.json *.png cordova-app/www/ 2>/dev/null || true
        
        # Unduh ikon resmi langsung ke root proyek untuk digunakan sebagai aset build
        curl -s -L -o cordova-app/icon-presensi.png https://azzahro.web.id/presensi/icon-presensi.png
        cp cordova-app/icon-presensi.png cordova-app/www/icon-presensi.png
        
        # OTOMATISASI LANDSCAPE KHUSUS REKAPITULASI
        sed -i 's/<\/body>/<script>document.addEventListener("deviceready", () => { if(window.screen \&\& window.screen.orientation) { window.screen.orientation.lock("landscape"); } }, false);<\/script><\/body>/g' cordova-app/www/rekapitulasi.html
        
        # OTOMATISASI PORTRAIT KHUSUS DEFAULT.HTML
        sed -i 's/<\/body>/<script>document.addEventListener("deviceready", () => { if(window.screen \&\& window.screen.orientation) { window.screen.orientation.lock("portrait"); } }, false);<\/script><\/body>/g' cordova-app/www/default.html
        
        # Jika ada folder tambahan seperti notification, ikut disalin
        if [ -d "notification" ]; then cp -r notification cordova-app/www/; fi

    - name: Configure Cordova config.xml (Perbaikan Struktur XML Manifest & Splash Modern)
      run: |
        cd cordova-app
        
        # SUNTIKKAN NAMESPACE ANDROID (Solusi Eror AttributePrefixUnbound)
        sed -i 's/<widget/<widget xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/g' config.xml
        
        # ATUR DEFAULT.HTML SEBAGAI HALAMAN UTAMA (ENTRY POINT)
        sed -i '/<\/widget>/i \    <content src="default.html" \/>' config.xml
        
        # Set Fullscreen dan Orientation dasar
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="Orientation" value="portrait" \/>' config.xml
        
        # Set Ikon Utama Aplikasi
        sed -i '/<\/widget>/i \    <icon src="icon-presensi.png" \/>' config.xml
        
        # KEBIJAKAN WHITELIST AKSES JARINGAN (Solusi Fetch/XHR Terblokir di Cordova)
        sed -i '/<\/widget>/i \    <access origin="*" \/>' config.xml
        sed -i '/<\/widget>/i \    <allow-navigation href="*" \/>' config.xml
        sed -i '/<\/widget>/i \    <allow-intent href="http:\/\/*\/*" \/>' config.xml
        sed -i '/<\/widget>/i \    <allow-intent href="https:\/\/*\/*" \/>' config.xml
        
        # KONFIGURASI SPLASH SCREEN MODERN (Android 12+ API Compliant)
        sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon-presensi.png" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenBackground" value="#ffffff" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="AutoHideSplashScreen" value="true" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="3000" \/>' config.xml
        
        # Buat blok konfigurasi izin dengan parent /manifest yang benar sesuai AAPT
        cat << 'EOF' > android_permissions.xml
            <platform name="android">
                <config-file target="AndroidManifest.xml" parent="/manifest">
                    <uses-permission android:name="android.permission.INTERNET" />
                    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                    <uses-permission android:name="android.permission.CAMERA" />
                    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
                    <uses-feature android:name="android.hardware.camera" android:required="true" />
                    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
                </config-file>
            </platform>
        EOF
        
        # Masukkan blok izin tepat sebelum tag penutup </widget>
        sed -i '/<\/widget>/e cat android_permissions.xml' config.xml

    - name: Build Android APK (Debug Signed)
      run: |
        cd cordova-app
        cordova build android --debug -- --packageType=apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 1
