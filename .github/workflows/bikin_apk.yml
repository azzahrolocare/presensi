name: Build Android APK (Presensi URL Wrapper)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-cache: 'npm'
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create cordova-app id.web.azzahro.presensi "Presensi Az-Zahro"
        cd cordova-app
        cordova platform add android
        
        # Tambahkan plugin inti UI, Kamera, Navigasi, dan Whitelist
        cordova plugin add cordova-plugin-statusbar
        cordova plugin add cordova-plugin-inappbrowser
        cordova plugin add cordova-plugin-camera
        cordova plugin add cordova-plugin-android-permissions
        cordova plugin add cordova-plugin-screen-orientation
        cordova plugin add cordova-plugin-whitelist

    - name: Download App Icon
      run: |
        curl -s -L -o cordova-app/icon-presensi.png https://azzahro.web.id/presensi/icon-presensi.png

    - name: Configure Cordova config.xml (URL Wrapper & Whitelist)
      run: |
        cd cordova-app
        
        # SUNTIKKAN NAMESPACE ANDROID
        sed -i 's/<widget/<widget xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android"/g' config.xml
        
        # UBAH KONTEN UTAMA AGAR LANGSUNG MEMUAT LINK WEBSITE AZ-ZAHRO
        sed -i 's/<content src="index.html" \/>/<content src="https:\/\/azzahro.web.id\/presensi\/" \/>/g' config.xml
        
        # Set Fullscreen, Orientasi, Ikon, dan Whitelist Akses Penuh
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="Orientation" value="portrait" \/>' config.xml
        sed -i '/<\/widget>/i \    <icon src="icon-presensi.png" \/>' config.xml
        sed -i '/<\/widget>/i \    <access origin="*" \/>' config.xml
        sed -i '/<\/widget>/i \    <allow-navigation href="*" \/>' config.xml
        sed -i '/<\/widget>/i \    <allow-intent href="http:\/\/*\/*" \/>' config.xml
        sed -i '/<\/widget>/i \    <allow-intent href="https:\/\/*\/*" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="backgroundColor" value="0xFF0F5132" \/>' config.xml
        
        # Konfigurasi Splash Screen Hijau
        sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon-presensi.png" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenBackground" value="#0F5132" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="AutoHideSplashScreen" value="true" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="2000" \/>' config.xml
        
        # Hapus tag penutup widget lama agar bisa disisipi konfigurasi izin Android
        sed -i '$d' config.xml
        
        # Tambahkan izin Android (Kamera & Internet)
        cat << 'EOF' >> config.xml
            <platform name="android">
                <config-file target="AndroidManifest.xml" parent="/manifest">
                    <uses-permission android:name="android.permission.INTERNET" />
                    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
                    <uses-permission android:name="android.permission.CAMERA" />
                    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
                    <uses-feature android:name="android.hardware.camera" android:required="true" />
                    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
                </config-file>
            </platform>
        </widget>
        EOF

    - name: Build Android APK (Debug Signed)
      run: |
        cd cordova-app
        cordova build android --debug -- --packageType=apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Presensi-Az-Zahro-APK
        path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
