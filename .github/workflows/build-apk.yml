name: Build Android APK (Presensi)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-cache: 'npm'
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create cordova-app id.web.azzahro.presensi "Presensi Az-Zahro"
        cd cordova-app
        cordova platform add android
        
        # Tambahkan plugin inti UI, Kamera, dan Navigasi
        cordova plugin add cordova-plugin-statusbar
        cordova plugin add cordova-plugin-splashscreen
        cordova plugin add cordova-plugin-inappbrowser
        cordova plugin add cordova-plugin-camera
        cordova plugin add cordova-plugin-android-permissions

    - name: Copy Web Assets to Cordova
      run: |
        # Bersihkan folder www bawaan cordova
        rm -rf cordova-app/www/*
        
        # Salin file web utama saja ke folder www cordova agar tidak bentrok dengan patch lama
        cp -r index.html offline.html rekapitulasi.html sw.js manifest.json *.png cordova-app/www/ 2>/dev/null || true
        
        # Jika ada folder tambahan seperti notification, ikut disalin
        if [ -d "notification" ]; then cp -r notification cordova-app/www/; fi

    - name: Configure Cordova config.xml (Aman & Bersih)
      run: |
        cd cordova-app
        
        # Set Fullscreen dan Orientation
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="Orientation" value="portrait" \/>' config.xml
        
        # Set Icon Aplikasi
        if [ -f "www/icon-presensi.png" ]; then
          sed -i '/<\/widget>/i \    <icon src="www/icon-presensi.png" \/>' config.xml
        fi
        
        # Tambahkan konfigurasi izin kamera Android secara rapi
        sed -i '/<\/widget>/i \    <platform name="android">\n        <config-file target="AndroidManifest.xml" parent="/*">\n            <uses-permission android:name="android.permission.CAMERA" \/>\n            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n            <uses-feature android:name="android.hardware.camera" \/>\n            <uses-feature android:name="android.hardware.camera.autofocus" \/>\n        <\/config-file>\n    <\/platform>' config.xml

    - name: Build Android APK (Debug Signed)
      run: |
        cd cordova-app
        cordova build android --debug -- --packageType=apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Presensi-Az-Zahro-APK
        path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
