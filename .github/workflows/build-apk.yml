name: Build Android APK (Presensi)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-cache: 'npm'
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project
      run: |
        cordova create cordova-app id.web.azzahro.presensi "Presensi Az-Zahro"
        cd cordova-app
        cordova platform add android
        
        # Tambahkan plugin inti UI dan Navigasi
        cordova plugin add cordova-plugin-statusbar
        cordova plugin add cordova-plugin-splashscreen
        cordova plugin add cordova-plugin-inappbrowser
        
        # Tambahkan plugin untuk akses Kamera dan Izin Android resmi
        cordova plugin add cordova-plugin-camera
        cordova plugin add cordova-plugin-android-permissions

    - name: Copy Web Assets to Cordova
      run: |
        # Bersihkan folder www bawaan cordova
        rm -rf cordova-app/www/*
        
        # Salin semua file dari root repositori ke www
        rsync -av --exclude='cordova-app' --exclude='.github' --exclude='.git' ./ cordova-app/www/

    - name: Configure Cordova config.xml & Permissions
      run: |
        cd cordova-app
        # Mengatur agar aplikasi fullscreen dan orientasi portrait
        sed -i '/<\/widget>/i <preference name="Fullscreen" value="true" \/>' config.xml
        sed -i '/<\/widget>/i <preference name="Orientation" value="portrait" \/>' config.xml
        
        # Suntikkan dekorasi izin kamera langsung ke dalam manifest android via config.xml
        sed -i '/<\/widget>/i <platform name="android"><config-file target="AndroidManifest.xml" parent="/*"><uses-permission android:name="android.permission.CAMERA" \/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/><uses-feature android:name="android.hardware.camera" \/><uses-feature android:name="android.hardware.camera.autofocus" \/><\/config-file><\/platform>' config.xml
        
        # Set icon menggunakan icon-presensi.png
        if [ -f "www/icon-presensi.png" ]; then
          sed -i '/<\/widget>/i <icon src="www/icon-presensi.png" \/>' config.xml
        fi

    - name: Build Android APK (Debug Signed)
      run: |
        cd cordova-app
        cordova build android --debug -- --packageType=apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Presensi-Az-Zahro-APK
        path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
