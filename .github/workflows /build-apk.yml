name: Build APK with Splash Screen and Fullscreen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori Anda (Isi sesuai Screenshot_20260704-191818.jpg)
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Setup Environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 3. Install Cordova secara global
    - name: Install Cordova
      run: npm install -g cordova

    # 4. Inisialisasi dan Konfigurasi Cordova langsung di Root Repositori
    - name: Configure Cordova App
      run: |
        # Membuat folder www dan memindahkan file website Anda ke dalamnya (Standar Cordova)
        mkdir -p www
        
        # Pindahkan semua file bawaan repo ke folder www (kecuali folder .github dan www itu sendiri)
        find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.github' ! -name 'www' -exec mv {} www/ \;

        # Buat file config.xml langsung di root
        cat << 'EOF' > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.azzahro.presensi" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Presensi Az-Zahro</name>
            <description>Aplikasi Presensi Digital Az-Zahro</description>
            <author email="dev@azzahro.web.id" href="https://azzahro.web.id">Az-Zahro Team</author>
            
            <!-- Mengarahkan content langsung ke website utama agar sinkron -->
            <content src="https://azzahro.web.id/presensi/" />
            
            <!-- Keamanan Navigasi Webview -->
            <access origin="*" />
            <allow-navigation href="http://*/*" />
            <allow-navigation href="https://*/*" />
            <allow-navigation href="https://azzahro.web.id/*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            
            <preference name="StayInApp" value="true" />
            <preference name="Fullscreen" value="true" />

            <!-- Splash Screen Android Modern -->
            <preference name="SplashScreenDelay" value="3000" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="FadeSplashScreen" value="true" />
            <preference name="FadeSplashScreenDuration" value="500" />
            <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />
            
            <platform name="android">
                <!-- Menggunakan ikon yang sudah ada di repo Anda (berdasarkan screenshot) -->
                <icon src="www/icon-presensi.png" />
                <preference name="AndroidWindowSplashScreenAnimatedIcon" value="www/icon-presensi.png" />
                <preference name="MixedContentMode" value="0" />
            </platform>
        </widget>
        EOF

        # Tambahkan platform Android
        cordova platform add android

    # 5. Kompilasi APK (Tanpa masuk ke subfolder lagi)
    - name: Build Android APK
      run: |
        cordova build android --debug

    # 6. Unggah File Murni APK (Jalur path diperbaiki tanpa subfolder apk-project)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Presensi-Digital-AzZahro-APK
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
