name: Build APK with Splash Screen and Fullscreen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori Anda
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Setup Environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 3. Install Cordova secara global
    - name: Install Cordova
      run: npm install -g cordova

    # 4. Buat Proyek Cordova Terpisah (Solusi Bersih)
    - name: Create Cordova App and Generate Config
      run: |
        # Buat proyek terpisah agar tidak tabrakan dengan file root repo Anda
        cordova create apk-project com.azzahro.presensi "Presensi Az-Zahro"
        cd apk-project
        
        # Buat folder untuk ikon bawaan Android
        mkdir -p res/icon/android
        
        # Ambil ikon dari root repositori Anda yang sudah dicheckout tadi
        cp ../icon-presensi.png res/icon/android/icon.png

        # Tulis ulang config.xml dengan benar di dalam apk-project
        cat << 'EOF' > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.azzahro.presensi" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Presensi Az-Zahro</name>
            <description>Aplikasi Presensi Digital Az-Zahro</description>
            <author email="dev@azzahro.web.id" href="https://azzahro.web.id">Az-Zahro Team</author>
            
            <!-- URL webview tujuan utama Anda -->
            <content src="https://azzahro.web.id/presensi/" />
            
            <!-- Pencegahan agar webview tidak terlempar ke luar aplikasi -->
            <access origin="*" />
            <allow-navigation href="http://*/*" />
            <allow-navigation href="https://*/*" />
            <allow-navigation href="https://azzahro.web.id/*" />
            <allow-intent href="http://*/*" />
            <allow-intent href="https://*/*" />
            
            <preference name="StayInApp" value="true" />
            <preference name="Fullscreen" value="true" />

            <!-- Splash Screen Android Modern -->
            <preference name="SplashScreenDelay" value="3000" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="FadeSplashScreen" value="true" />
            <preference name="FadeSplashScreenDuration" value="500" />
            <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />
            
            <platform name="android">
                <icon src="res/icon/android/icon.png" />
                <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/icon/android/icon.png" />
                <preference name="MixedContentMode" value="0" />
            </platform>
        </widget>
        EOF

        # Tambahkan platform android setelah config.xml siap
        cordova platform add android

    # 5. Kompilasi APK (Masuk ke dalam sub-folder apk-project)
    - name: Build Android APK
      run: |
        cd apk-project
        cordova build android --debug

    # 6. Pindahkan File APK ke Root dan Beri Nama Unik (Trik Utama Penghilang .tar)
    - name: Prepare Pure APK File
      run: |
        cp apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk ./Presensi-Digital-AzZahro.apk

    # 7. Unggah File APK Murni tunggal
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Presensi-Digital-AzZahro-APK
        path: Presensi-Digital-AzZahro.apk
