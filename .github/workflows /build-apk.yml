name: Build APK with Splash Screen and Fullscreen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 2. Setup Environment (Node.js, JDK, SDK)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # 3. Install Cordova secara global
    - name: Install Cordova
      run: npm install -g cordova

    # 4. Buat Proyek dan Struktur Konfigurasi (Digabung agar satu direktori kerja)
    - name: Create Cordova App and Generate Config
      run: |
        # 1. Buat proyek dasar Cordova
        cordova create apk-project com.azzahro.presensi "Presensi Az-Zahro"
        cd apk-project
        
        # 2. Manajemen Aset Ikon
        mkdir -p res/icon/android
        curl -L -o res/icon/android/icon.png https://azzahro.web.id/presensi/icon-presensi.png

        # 3. Tulis Ulang config.xml (Sebelum menambahkan platform agar terkonfigurasi dengan benar)
        cat << 'EOF' > config.xml
        <?xml version='1.0' encoding='utf-8'?>
        <widget id="com.azzahro.presensi" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
            <name>Presensi Az-Zahro</name>
            <description>Aplikasi Presensi Digital Az-Zahro</description>
            <author email="dev@azzahro.web.id" href="https://azzahro.web.id">Az-Zahro Team</author>
            
            <content src="https://azzahro.web.id/presensi/" />
            
            <access origin="*" />
            <allow-navigation href="*" />
            <allow-intent href="*" />
            
            <preference name="StayInApp" value="true" />
            <preference name="Fullscreen" value="true" />

            <!-- Android Modern Splash Screen (Android 12+) -->
            <preference name="SplashScreenDelay" value="3000" />
            <preference name="AutoHideSplashScreen" value="true" />
            <preference name="FadeSplashScreen" value="true" />
            <preference name="FadeSplashScreenDuration" value="500" />
            <preference name="AndroidWindowSplashScreenBackground" value="#FFFFFF" />
            
            <platform name="android">
                <icon src="res/icon/android/icon.png" />
                <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/icon/android/icon.png" />
            </platform>
        </widget>
        EOF

        # 4. Tambahkan platform Android setelah config.xml diperbarui
        cordova platform add android

    # 5. Proses Kompilasi Menjadi Android APK
    - name: Build Android APK
      run: |
        cd apk-project
        cordova build android --debug

    # 6. Unggah Hasil Kompilasi ke GitHub Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Presensi-Digital-AzZahro-APK
        path: apk-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
