name: Build Android APK (Cordova)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code dari repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Setup Node.js (diperlukan untuk Cordova)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 18

      # 3. Setup Java Development Kit (JDK) untuk Android SDK
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Apache Cordova secara global
      - name: Install Cordova
        run: npm install -g cordova

      # 6. Membuat project Cordova baru dan memindahkan file web Anda ke dalamnya
      - name: Create Cordova Project & Prepare Files
        run: |
          cordova create my-app com.azzahro.presensi Presensi
          cd my-app
          # Hapus file bawaan Cordova di folder www
          rm -rf www/*
          # Salin semua file dari repository (kecuali folder my-app itu sendiri dan .github) ke folder www
          cp -r ../* . || true
          rm -rf my-app .github .git
          mv * www/ || true
          
          # Tambahkan platform Android
          cordova platform add android

      # 7. Build APK (Unaligned / Debug APK)
      - name: Build Android APK
        run: |
          cd my-app
          cordova build android --debug

      # 8. Upload Hasil APK agar bisa di-download
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: presensi-app-debug
          path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
