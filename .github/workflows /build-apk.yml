name: Build Android APK (Direct Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Initialize Cordova Project and Inject Code
        run: |
          cordova create cordova_project com.azzahro.presensi Presensi
          rm -rf cordova_project/www/*
          rsync -av --exclude='cordova_project' --exclude='.git' --exclude='.github' ./ cordova_project/www/
          cd cordova_project
          cordova platform add android@10.1.2 --save

      - name: Build Android APK (Debug)
        run: |
          cd cordova_project
          cordova build android --debug --device

      # Langkah Baru: Mengubah nama file APK agar unik dan jelas sebelum di-upload
      - name: Prepare APK File
        run: |
          cp cordova_project/platforms/android/app/build/outputs/apk/debug/app-debug.apk ./presensi-aplikasi.apk

      # Langkah Baru: Otomatis membuat GitHub Release dan menempelkan file .APK asli (Bukan ZIP)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release Presensi App Build #${{ github.run_number }}
          draft: false
          prerelease: false
          files: ./presensi-aplikasi.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
